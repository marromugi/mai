name: Mai
options:
  minimumXcodeGenVersion: 2.44.0
  bundleIdPrefix: com.marromugi
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: Q4DFD98D9R
    CODE_SIGN_STYLE: Automatic
packages:
  Modules:
    path: Packages/Modules
  Typesetting:
    path: Packages/Typesetting
  Sync:
    path: Packages/Sync
targets:
  Mai:
    type: application
    platform: iOS
    sources:
      - App
    entitlements:
      path: App/Mai.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    dependencies:
      - package: Modules
        product: Features
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marromugi.mai
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cotoma
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: 撮った写真を文章に添えるために、カメラを使います。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Merged into the generated Info.plist; carries MAI_SERVER to the app.
        INFOPLIST_FILE: App/Info.plist
      # The Worker each configuration talks to (Server/wrangler.jsonc).
      configs:
        Debug:
          MAI_SERVER: https://mai-server-dev.marrromugi-dev.workers.dev
        Release:
          MAI_SERVER: https://mai-server.marrromugi-dev.workers.dev
    scheme:
      testTargets:
        - MaiTests
      storeKitConfiguration: StoreKit/Mai.storekit
  MaiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
      - path: StoreKit/Mai.storekit
        buildPhase: resources
    dependencies:
      - target: Mai
      - package: Sync
        product: Sync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marromugi.mai.tests
        GENERATE_INFOPLIST_FILE: YES
