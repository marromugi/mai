name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Lint
        run: swift format lint --strict --recursive App Packages
      - name: Install XcodeGen
        run: |
          curl -fsSL -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q xcodegen.zip
          echo "$PWD/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: >
          xcodebuild build
          -project Mai.xcodeproj
          -scheme Mai
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
      - name: Check the asset catalog is in the Resources phase
        run: grep -q "Assets.xcassets in Resources" Mai.xcodeproj/project.pbxproj
