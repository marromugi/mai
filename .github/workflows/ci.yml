name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  model-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Check the read mode model with TLC
        run: scripts/model-check.sh

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Test that pr-images keeps the token out of its output
        run: node --test scripts/pr-images.test.mts

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: Server/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: Server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install sqld, the libSQL server the tests run on
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o sqld.tar.xz https://github.com/tursodatabase/libsql/releases/download/libsql-server-v0.24.32/libsql-server-x86_64-unknown-linux-gnu.tar.xz
          echo "71720fc8648c19efef416efebd47145ef59b62e198770533530a858e1336879f  sqld.tar.xz" | sha256sum -c -
          mkdir sqld && tar -xf sqld.tar.xz -C sqld
          dirname "$(find "$PWD/sqld" -type f -name sqld)" >> "$GITHUB_PATH"
      - name: Check worker-configuration.d.ts holds every environment of wrangler.jsonc
        run: pnpm types:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm test
      - name: Test that setting up an environment makes only what it lacks
        run: node --test scripts/setup.test.mts
      - name: Check each build of the app talks to the Worker wrangler.jsonc deploys for it
        run: |
          url() { echo "https://$(node scripts/environment.mjs "$1" | jq -r .worker).marrromugi-dev.workers.dev"; }
          settings() { sed -n "/^        $1:\$/,/^        [A-Z]/p" ../project.yml; }
          settings Debug | grep -qx "          MAI_SERVER: $(url staging)"
          settings Beta | grep -qx "          MAI_SERVER: $(url staging)"
          settings Beta | grep -qx "          MAI_APP_STORE_SERVER: $(url prod)"
          settings Release | grep -qx "          MAI_SERVER: $(url prod)"

  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Lint
        run: >
          swift format lint --strict --recursive
          App scripts Packages/Modules/Package.swift Packages/Modules/Sources
          Packages/Typesetting/Package.swift Packages/Typesetting/Sources Packages/Typesetting/Tests
          Packages/Sync/Package.swift Packages/Sync/Sources Packages/Sync/Tests AppTests
      - name: Test the typesetting on the Mac
        run: swift test --package-path Packages/Typesetting
      - name: Test sealing and syncing on the Mac
        run: swift test --package-path Packages/Sync --skip Contract
      - name: Install XcodeGen
        run: |
          curl -fsSL -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q xcodegen.zip
          echo "$PWD/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: >
          xcodebuild build
          -project Mai.xcodeproj
          -scheme Mai
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
      - name: Build the app's tests
        run: >
          xcodebuild build-for-testing
          -project Mai.xcodeproj
          -scheme Mai
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
      - name: Build the tests
        working-directory: Packages/Modules
        run: >
          xcodebuild build-for-testing
          -scheme Modules
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
      - name: Check the asset catalog is in the Resources phase
        run: grep -q "Assets.xcassets in Resources" Mai.xcodeproj/project.pbxproj
      - name: Check the app says why it uses the camera
        run: grep -q 'INFOPLIST_KEY_NSCameraUsageDescription = "[^"]' Mai.xcodeproj/project.pbxproj
      - name: Check the home screen names the app Cotoma
        run: grep -q 'INFOPLIST_KEY_CFBundleDisplayName = Cotoma;' Mai.xcodeproj/project.pbxproj
      - name: Check the Debug, Beta and Release builds each name a server
        run: test "$(grep -c 'MAI_SERVER = "https://' Mai.xcodeproj/project.pbxproj)" -eq 3
