name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Lint
        run: swift format lint --strict --recursive App Packages
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: >
          xcodebuild build
          -project Mai.xcodeproj
          -scheme Mai
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
